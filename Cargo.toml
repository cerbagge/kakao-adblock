[package]
name = "kakao-adblock"
version = "1.0.0"
edition = "2024"
description = "카카오톡 PC 광고와 오른쪽 아래 팝업을 숨기는 Windows 상주 프로그램"
license = "MIT"
repository = "https://github.com/cerbagge/kakao-adblock"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
